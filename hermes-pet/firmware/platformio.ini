; Firmware Hermes Pet pour M5Stack StopWatch (ESP32-S3R8, 16 Mo flash, 8 Mo PSRAM).
; Compiler :   pio run
; Flasher :    pio run -t upload      (montre branchée en USB-C)
; Journal :    pio device monitor

[env:m5stack-stopwatch]
platform = espressif32@6.9.0
; Carte proposée par la recette PlatformIO officielle de M5Stack pour le StopWatch.
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.15
    m5stack/M5GFX@^0.2.21
    bblanchon/ArduinoJson@^7.4.2
